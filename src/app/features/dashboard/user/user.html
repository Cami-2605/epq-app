<div class="page-shell users-page">
  <header class="top-bar">
    <div class="brand">
      <img src="https://res.cloudinary.com/dmjww2gh5/image/upload/v1765378795/logo_epq_jrplxy.png" class="logo" alt="Logo EPQ" />
      <span class="name">Empresas Públicas del Quindío EPQ</span>
    </div>
    <div class="user-actions">
      <div class="avatar" [style.backgroundImage]="'url(' + usuarioFoto + ')'"></div>
      <button class="pill-btn" (click)="goToPerfil()">Mi Perfil</button>
      <button class="pill-btn" (click)="logout()">Cerrar sesión</button>
    </div>
  </header>

  <nav class="tabs">
    <button (click)="goToExcel()">Subir Excel</button>
    <span class="sep"></span>
    <button class="active" (click)="goToGenerador()">Generar Reporte</button>
  </nav>

  <main class="users-content">
    <h1>Gestión de Usuarios</h1>
    <div class="section-divider"></div>

    <div *ngIf="error" class="alert error">{{ error }}</div>
    <div *ngIf="loading" class="loading-state">Cargando usuarios…</div>

    <div class="welcome-card" *ngIf="!loading">
      <table class="users-table" *ngIf="users.length > 0; else sinUsuarios">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Usuario</th>
            <th>Correo</th>
            <th>Teléfono</th>
            <th>Rol</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let u of users">
            <td>{{ u.nombreCompleto }}</td>
            <td>{{ u.username }}</td>
            <td>{{ u.correo }}</td>
            <td>{{ u.telefono || '–' }}</td>
            <td>
              <span class="rol-badge" [class.admin]="u.rol === 'admin'">
                {{ u.rol === 'admin' ? 'Admin' : 'Usuario' }}
              </span>
            </td>
            <td>
              <button class="small-btn danger" (click)="eliminarUsuario(u)">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
      <ng-template #sinUsuarios>
        <p>No hay usuarios registrados.</p>
      </ng-template>
    </div>
  </main>
</div>
