<div class="page-shell users-page">
  <header class="top-bar">
    <div class="brand">
      <img src="https://res.cloudinary.com/dmjww2gh5/image/upload/v1765378795/logo_epq_jrplxy.png" class="logo" alt="Logo EPQ" />
      <span class="name">Empresas Públicas del Quindío EPQ</span>
    </div>
    <div class="user-actions">
      <div class="avatar" [style.backgroundImage]="'url(' + usuarioFoto + ')'"></div>
      <span class="user-name">Usuario</span>
      <button class="pill-btn" (click)="goToPerfil()">Mi Perfil</button>
      <button class="pill-btn" (click)="logout()">Cerrar sesión</button>
    </div>
  </header>

  <nav class="tabs">
    <button (click)="goToExcel()">📊 Subir Excel</button>
    <span class="sep"></span>
    <button (click)="goToGenerador()">📈 Generar Reporte</button>
    <span class="sep"></span>
    <button class="active">👥 Gestionar Usuarios</button>
  </nav>

  <main class="users-content">
    <h1>Gestión de Usuarios</h1>
    <div class="section-divider"></div>

    <section class="table-box">
      <div class="table-header">
        <span>Acción</span>
        <span>Nombre</span>
        <span>Cédula</span>
        <span>Correo</span>
        <span>Teléfono</span>
      </div>

      <div class="table-row" *ngFor="let user of users">
        <div class="actions">
          <button class="view" (click)="view(user)" title="Ver">👁</button>
          <button class="edit" (click)="edit(user)" title="Editar">✎</button>
          <button class="delete" (click)="remove(user)" title="Eliminar">🗑️</button>
        </div>
        <span>{{ user.nombre }}</span>
        <span>{{ user.cedula }}</span>
        <span>{{ user.correo }}</span>
        <span>{{ user.telefono }}</span>
      </div>
    </section>
  </main>
</div>
